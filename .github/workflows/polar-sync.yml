name: Polar daily sync

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC, poco después del de Garmin
  workflow_dispatch:
    inputs:
      atleta:
        description: "Clave del atleta a sincronizar (vacío = todos los de POLAR_ATLETAS, comportamiento normal)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar sync de Polar
        env:
          POLAR_CLIENT_ID: ${{ secrets.POLAR_CLIENT_ID }}
          POLAR_CLIENT_SECRET: ${{ secrets.POLAR_CLIENT_SECRET }}
          # Si se pide un atleta concreto (botón "Sincronizar ahora"), se usa solo
          # ese; si no, se usa la lista completa de POLAR_ATLETAS (comportamiento
          # normal del cron diario).
          POLAR_ATLETAS: ${{ github.event.inputs.atleta || vars.POLAR_ATLETAS }}
          # Añade aquí un POLAR_ACCESS_TOKEN_<ATLETA> / POLAR_USER_ID_<ATLETA>
          # por cada atleta que se vaya vinculando (ver connectors/polar/authorize.py).
          # GitHub Actions no permite variables dinámicas aquí, así que hay que
          # añadir una línea explícita por atleta, ej.:
          POLAR_ACCESS_TOKEN_CGR: ${{ secrets.POLAR_ACCESS_TOKEN_CGR }}
          POLAR_USER_ID_CGR: ${{ secrets.POLAR_USER_ID_CGR }}
        run: python connectors/polar/sync.py
