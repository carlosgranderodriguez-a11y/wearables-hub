name: Garmin daily sync

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC todos los días — sincroniza a todos los de GARMIN_ATLETAS
  workflow_dispatch:        # permite lanzarlo a mano, o bajo demanda desde el botón de la app
    inputs:
      atleta:
        description: "Clave del atleta a sincronizar (vacío = todos los de GARMIN_ATLETAS, comportamiento normal)"
        required: false
        default: ""
      fecha:
        description: "Fecha a recuperar (YYYY-MM-DD). Vacío = ayer (comportamiento normal)."
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install garminconnect requests

      - name: Ejecutar sync de Garmin
        env:
          # Si se pide un atleta concreto (botón "Sincronizar ahora"), se usa solo
          # ese; si no, se usa la lista completa de GARMIN_ATLETAS (comportamiento
          # normal del cron diario). El propio script decide con cuál sincronizar.
          GARMIN_ATHLETE: ${{ github.event.inputs.atleta }}
          GARMIN_ATLETAS: ${{ vars.GARMIN_ATLETAS }}
          GARMIN_SYNC_DATE: ${{ github.event.inputs.fecha }}
          # Añade aquí un GARMIN_EMAIL_<ATLETA> / GARMIN_PASSWORD_<ATLETA> por
          # cada atleta que se vaya vinculando (el conector self-service ya
          # escribe esos secrets solo — ver README — pero GitHub Actions no
          # permite nombres de secret dinámicos, así que hace falta declarar
          # cada línea aquí a mano una vez, la primera vez que se conecta):
          GARMIN_EMAIL_CGR: ${{ secrets.GARMIN_EMAIL_CGR }}
          GARMIN_PASSWORD_CGR: ${{ secrets.GARMIN_PASSWORD_CGR }}
          # ── Ajuste del cálculo de hrTSS (todos opcionales, admiten sufijo _<ATLETA>) ──
          # FC umbral medida. Si se define, tiene prioridad sobre la estimación.
          GARMIN_FC_UMBRAL: ${{ secrets.GARMIN_FC_UMBRAL }}
          # FC máxima real, por si la que tiene Garmin está desactualizada.
          GARMIN_FC_MAX: ${{ secrets.GARMIN_FC_MAX }}
          # % de la FC máx usado para estimar el umbral (por defecto 88).
          GARMIN_UMBRAL_PCT: ${{ vars.GARMIN_UMBRAL_PCT }}
        run: python connectors/garmin/sync.py
