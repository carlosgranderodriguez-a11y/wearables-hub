name: Garmin daily sync

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC todos los días
  workflow_dispatch:        # permite lanzarlo a mano desde GitHub
    inputs:
      fecha:
        description: "Fecha a recuperar (YYYY-MM-DD). Vacío = ayer (comportamiento normal)."
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install garminconnect requests

      - name: Ejecutar sync de Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_ATHLETE: CGR
          GARMIN_SYNC_DATE: ${{ github.event.inputs.fecha }}
          # FC umbral para calcular hrTSS. Si no se define, se intenta leer
          # de Garmin; si tampoco está, el hrTSS queda vacío.
          GARMIN_FC_UMBRAL: ${{ secrets.GARMIN_FC_UMBRAL }}
        run: python connectors/garmin/sync.py
